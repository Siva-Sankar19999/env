name: Deployment
on:
  push:
    branches:
      - main
      - dev

env:
  MONGODB_DB_NAME: sample_mflix

jobs:

  test:
    env: 
      MONGODB_CLUSTER_ADDRESS: test.wnzd5ah.mongodb.net
      MONGODB_USERNAME: sivasankar
      PORT: 8080

    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: echo "http://127.0.0.1:$PORT"
      
      - name: Output information
        run: |
          echo "${{ env.MONGODB_USERNAME }}"
          echo "${{ secrets.MONGODB_PASSWORD}}"


  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |        
          echo "..."
